services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: grafika
      POSTGRES_USER: grafika
      POSTGRES_PASSWORD: grafika_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grafika"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: "postgres://grafika:grafika_dev@postgres:5432/grafika?sslmode=disable"
      ML_SERVICE_URL: "http://ml:8000"
      SERVER_PORT: "8080"
      GIN_MODE: "debug"
    depends_on:
      postgres:
        condition: service_healthy

  ml:
    build:
      context: ./ml
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY:-sk-placeholder}"
      LLM_MODEL: "gpt-4o-mini"
      BACKEND_URL: "http://backend:8080"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8080/api/v1"
    depends_on:
      - backend

volumes:
  pgdata:
